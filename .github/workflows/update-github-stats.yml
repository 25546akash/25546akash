
name: Update GitHub Statistics

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Generate GitHub Statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=25546akash&show_icons=true&theme=transparent&hide_border=true
          path: stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=25546akash&layout=compact&theme=transparent&hide_border=true&langs_count=8
          path: top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Updated Statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.svg top-langs.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub statistics"
            git push
          fi
